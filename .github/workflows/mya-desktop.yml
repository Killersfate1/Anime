name: Mya desktop checks

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/mya-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only desktop code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript source syntax
        run: npm run check
        working-directory: desktop
      - name: Logic tests (no API keys or user assets)
        run: npm test
        working-directory: desktop
