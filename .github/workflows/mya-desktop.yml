name: Mya desktop checks

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/mya-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only desktop code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop modules (without Electron binary download)
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - name: Verify VRM package integration
        run: |
          test -f node_modules/@pixiv/three-vrm/lib/three-vrm.module.js
          node --input-type=module -e "import('@pixiv/three-vrm').then(m => { if (!m.VRMLoaderPlugin) process.exit(1); })"
        working-directory: desktop
      - name: JavaScript source syntax
        run: npm run check
        working-directory: desktop
      - name: Logic tests (no API keys or user assets)
        run: npm test
        working-directory: desktop
